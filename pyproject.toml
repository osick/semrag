[project]
name = "semrag"
version = "0.5.0"
description = "Enterprise-Grade Semantic RAG with FastMCP, Vector+Graph Intelligence, and Multi-Source Ingestion"
authors = [
    { name = "SEMRAG Team" },
]
dependencies = [
    "langchain",
    "langgraph",
    "langchain-text-splitters",
    "langchain-community",
    "langchain-openai",
    "langchain-ollama",
    "litellm",
    "qdrant-client",
    "neo4j",
    "redis",
    "unstructured[all-docs]",
    "pytest",
    "pytest-docker",
    "python-dotenv",
    "pydantic",
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "fsspec",
    "s3fs",
    "gcsfs",
    "pyvis",
    "rdflib",
    "mcp",
    "fastmcp",
    "networkx",
    "cdlib",
    "structlog",
    "jellyfish",
    "python-multipart",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semrag"]
